<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AudioSumm</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}"
    />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-form">
          <h1>Login</h1>
          <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="text" id="email" name="email" required />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-input">
                <input type="password" id="password" name="password" required />
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword()"
                >
                  <img
                    src="{{ url_for('static', filename='images/eye.svg') }}"
                    alt="Toggle password"
                  />
                </button>
              </div>
            </div>
            <div class="form-links">
              <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            <button type="submit" class="auth-button">Login</button>
            <div class="auth-footer">
              <p>Don't have an account? <a href="/auth/signup">Sign up</a></p>
            </div>
          </form>
        </div>
        <div class="auth-image">
          <div class="image-content">
            <img
              src="{{ url_for('static', filename='images/progress.svg') }}"
              alt="Project Progress"
            />
            <h2>Check Your Project Progress</h2>
            <p>
              Listen to your audio files and track your project performance!
            </p>
            <div class="dots">
              <span class="dot active"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
        } else {
          passwordInput.type = "password";
        }
      }

      async function handleLogin(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          console.log(email, password);
          const response = await fetch("/auth/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include", // Important: This ensures cookies are sent/received
            body: JSON.stringify({ email, password }),
          });

          if (response.ok) {
            const data = await response.json();
            // Redirect to dashboard - cookies are automatically handled by browser
            window.location.href = "/dashboard";
          } else {
            const error = await response.json();
            alert(error.error || "Login failed");
          }
        } catch (error) {
          console.error("Error:", error);
          alert("An error occurred during login");
        }

        return false;
      }
    </script>
  </body>
</html>
