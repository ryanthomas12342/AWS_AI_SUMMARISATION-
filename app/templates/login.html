<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AudioSumm</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}"
    />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-form">
          <h1>Login</h1>
          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" name="username" required />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-input">
                <input type="password" id="password" name="password" required />
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword()"
                >
                  <img
                    src="{{ url_for('static', filename='images/eye.svg') }}"
                    alt="Toggle password"
                  />
                </button>
              </div>
            </div>
            <div class="form-links">
              <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            <button type="submit" class="auth-button">Login</button>
            <div class="auth-footer">
              <p>Don't have an account? <a href="/auth/signup">Sign up</a></p>
            </div>
          </form>
        </div>
        <div class="auth-image">
          <div class="image-content">
            <img
              src="{{ url_for('static', filename='images/progress.svg') }}"
              alt="Project Progress"
            />
            <h2>Check Your Project Progress</h2>
            <p>
              Listen to your audio files and track your project performance!
            </p>
            <div class="dots">
              <span class="dot active"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
        } else {
          passwordInput.type = "password";
        }
      }

      function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        fetch("/auth/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            username: username,
            password: password,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.token) {
              localStorage.setItem("token", data.token);
              localStorage.setItem("user_id", data.user_id);
              window.location.href = "/dashboard";
            } else {
              alert(data.msg || "Login failed");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("Login failed");
          });
      }
    </script>
  </body>
</html>
