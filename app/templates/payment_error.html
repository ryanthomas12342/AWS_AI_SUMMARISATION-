<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Error - AudioSumm</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/dashboard.css') }}"
    />
  </head>
  <body>
    <div class="error-container">
      <div class="error-card">
        <i class="fas fa-exclamation-circle error-icon"></i>
        <h1>Payment Error</h1>
        <p>{{ message }}</p>
        <a
          href="{{ url_for('summaries_bp.list_summaries') }}"
          class="btn-secondary"
        >
          Return to Summaries
        </a>
      </div>
    </div>
  </body>
</html>
