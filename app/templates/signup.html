<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - AudioSumm</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}"
    />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-form">
          <h1>Sign Up</h1>
          <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" name="username" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-input">
                <input type="password" id="password" name="password" required />
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword('password')"
                >
                  <img
                    src="{{ url_for('static', filename='images/eye.svg') }}"
                    alt="Toggle password"
                  />
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <div class="password-input">
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  required
                />
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword('confirmPassword')"
                >
                  <img
                    src="{{ url_for('static', filename='images/eye.svg') }}"
                    alt="Toggle password"
                  />
                </button>
              </div>
            </div>
            <button type="submit" class="auth-button">Sign Up</button>
            <div class="auth-footer">
              <p>Already have an account? <a href="/auth/login">Login</a></p>
            </div>
          </form>
        </div>
        <div class="auth-image">
          <div class="image-content">
            <img
              src="{{ url_for('static', filename='images/progress.svg') }}"
              alt="Project Progress"
            />
            <h2>Start Your Journey</h2>
            <p>
              Create an account to begin processing and analyzing your audio
              files!
            </p>
            <div class="dots">
              <span class="dot"></span>
              <span class="dot active"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function togglePassword(inputId) {
        const passwordInput = document.getElementById(inputId);
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
        } else {
          passwordInput.type = "password";
        }
      }

      function handleSignup(event) {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          alert("Passwords do not match");
          return;
        }

        fetch("/auth/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            username: username,
            email: email,
            password: password,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.msg === "Usser create sucessfully") {
              window.location.href = "/auth/login";
            } else {
              alert(data.msg || "Signup failed");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("Signup failed");
          });
      }
    </script>
  </body>
</html>
