<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
    <!-- Background shapes -->
    <circle cx="200" cy="150" r="140" fill="#f0f3ff"/>
    <circle cx="200" cy="150" r="100" fill="#e2e8ff"/>
    
    <!-- Chart elements -->
    <rect x="120" y="180" width="40" height="60" rx="4" fill="#4c6fff" opacity="0.9"/>
    <rect x="180" y="140" width="40" height="100" rx="4" fill="#4c6fff"/>
    <rect x="240" y="160" width="40" height="80" rx="4" fill="#4c6fff" opacity="0.7"/>
    
    <!-- Decorative elements -->
    <circle cx="140" cy="100" r="15" fill="#4c6fff" opacity="0.2"/>
    <circle cx="260" cy="80" r="10" fill="#4c6fff" opacity="0.3"/>
    <circle cx="200" cy="60" r="12" fill="#4c6fff" opacity="0.2"/>
    
    <!-- Progress line -->
    <path d="M100,120 Q200,180 300,100" stroke="#4c6fff" stroke-width="3" fill="none"/>
    <circle cx="300" cy="100" r="6" fill="#4c6fff"/>
</svg> 